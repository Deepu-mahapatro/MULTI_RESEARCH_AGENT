<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         GOOGLE ANALYTICS 4
    =========================================== -->

    <!--
        Google Analytics 4
        Tracks visitors and website activity.
    -->
    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-Y0344419RE"
    ></script>

    <script>
        /*
            Create the Google Analytics data layer.

            Google Analytics uses this to store
            tracking events.
        */
        window.dataLayer = window.dataLayer || [];


        /*
            Google Analytics tracking function.
        */
        function gtag() {
            dataLayer.push(arguments);
        }


        /*
            Initialize Google Analytics.
        */
        gtag("js", new Date());


        /*
            Configure Google Analytics
            using the ResearchAI Measurement ID.
        */
        gtag("config", "G-Y0344419RE");
    </script>


    <!-- ==========================================
         PAGE META INFORMATION
    =========================================== -->

    <!-- Character encoding -->
    <meta charset="UTF-8">


    <!-- Responsive design -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- Browser title -->
    <title>ResearchAI</title>


    <!-- Page description for search engines -->
    <meta
        name="description"
        content="ResearchAI — Multi-Agent AI Research Assistant"
    >


    <!-- ==========================================
         AUTOMATIC REDIRECT
    =========================================== -->

    <!--
        Redirect the root frontend page
        to the main ResearchAI research page.

        When a user opens:

            /
        
        they will automatically be taken to:

            /pages/research.html

        No button or link is required.
    -->
    <meta
        http-equiv="refresh"
        content="0; url=pages/research.html"
    >

</head>


<body>

    <!-- ==========================================

    =========================================== -->

    -->
