<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         GOOGLE ANALYTICS 4
    =========================================== -->

    <!--
        Loads the Google Analytics library.
        The async attribute allows it to load
        without blocking the page.
    -->
    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-Y0344419RE"
    ></script>

    <script>
        // Create the Google Analytics data layer.
        window.dataLayer = window.dataLayer || [];

        // Google Analytics tracking function.
        function gtag() {
            dataLayer.push(arguments);
        }

        // Initialize Google Analytics.
        gtag("js", new Date());

        // Configure Google Analytics
        // using the ResearchAI Measurement ID.
        gtag("config", "G-Y0344419RE");
    </script>


    <!-- ==========================================
         PAGE META INFORMATION
    =========================================== -->

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Browser title -->
    <title>Research Report — ResearchAI</title>


    <!-- ==========================================
         CSS
    =========================================== -->

    <!-- Global styles -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <!-- Report page styles -->
    <link
        rel="stylesheet"
        href="../css/report.css"
    >

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="site-header report-header">

        <!-- ResearchAI brand -->
        <a
            href="../index.html"
            class="brand"
        >
            ResearchAI
        </a>


        <div class="header-actions">

            <!-- Theme toggle -->
            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
            >

                <span class="theme-icon">
                    ☼
                </span>

                <span class="theme-label">
                    Light mode
                </span>

            </button>


            <!-- New research -->
            <a
                href="research.html"
                class="new-research-button"
            >
                New Research
            </a>

        </div>

    </header>



    <!-- ==========================================
         MAIN REPORT
    =========================================== -->

    <main class="report-page">


        <!-- ======================================
             REPORT HEADING
        ======================================= -->

        <section class="report-top">

            <!-- Back to research -->
            <a
                href="research.html"
                class="back-link"
            >
                ← Back to Research
            </a>


            <div class="report-heading-row">


                <!-- Report title -->
                <div class="report-heading">

                    <h1 id="reportTitle">
                        Research Report
                    </h1>

                    <p id="reportDate">
                        ResearchAI
                    </p>

                </div>


                <!-- Report actions -->
                <div class="report-actions">

                    <!-- Download report -->
                    <button
                        type="button"
                        class="report-action"
                        id="downloadReport"
                    >
                        ↓ Download PDF
                    </button>


                    <!-- Share report -->
                    <button
                        type="button"
                        class="report-action"
                        id="shareReport"
                    >
                        ⤴ Share
                    </button>

                </div>

            </div>

        </section>



        <!-- ==========================================
             REPORT + SIDEBAR
        =========================================== -->

        <div class="report-layout">


            <!-- ======================================
                 MAIN REPORT CONTENT
            ======================================= -->

            <section class="report-content">


                <!-- Report tabs -->
                <nav
                    class="report-tabs"
                    aria-label="Report sections"
                >

                    <button
                        type="button"
                        class="report-tab active"
                        data-tab="report"
                    >
                        Report
                    </button>


                    <button
                        type="button"
                        class="report-tab"
                        data-tab="sources"
                    >
                        Sources
                    </button>


                    <button
                        type="button"
                        class="report-tab"
                        data-tab="review"
                    >
                        AI Review
                    </button>


                    <button
                        type="button"
                        class="report-tab"
                        data-tab="summary"
                    >
                        Summary
                    </button>

                </nav>



                <!-- ==================================
                     GENERATED REPORT
                =================================== -->

                <article
                    class="research-report"
                    id="reportContent"
                >

                    <p class="loading-report">
                        Loading research report...
                    </p>

                </article>



                <!-- ==================================
                     SOURCES TAB
                =================================== -->

                <section
                    class="tab-panel hidden"
                    id="sourcesPanel"
                >

                    <h2>
                        Sources
                    </h2>

                    <div
                        id="allSources"
                        class="all-sources-list"
                    ></div>

                </section>



                <!-- ==================================
                     AI REVIEW TAB
                =================================== -->

                <section
                    class="tab-panel hidden"
                    id="reviewPanel"
                >

                    <h2>
                        AI Review
                    </h2>

                    <div id="reviewContent"></div>

                </section>



                <!-- ==================================
                     SUMMARY TAB
                =================================== -->

                <section
                    class="tab-panel hidden"
                    id="summaryPanel"
                >

                    <h2>
                        Research Summary
                    </h2>

                    <div id="summaryContent"></div>

                </section>

            </section>



            <!-- ======================================
                 SIDEBAR
            ======================================= -->

            <aside class="report-sidebar">


                <!-- ==================================
                     RESEARCH OVERVIEW
                =================================== -->

                <section class="overview-card">

                    <h2>
                        Research Overview
                    </h2>


                    <!-- Sources analyzed -->
                    <div class="overview-stat">

                        <span class="stat-icon">
                            ▣
                        </span>

                        <div>

                            <strong id="sourceTotal">
                                0
                            </strong>

                            <span>
                                Sources analyzed
                            </span>

                        </div>

                    </div>



                    <!-- Word count -->
                    <div class="overview-stat">

                        <span class="stat-icon">
                            ▤
                        </span>

                        <div>

                            <strong id="wordTotal">
                                0
                            </strong>

                            <span>
                                Words
                            </span>

                        </div>

                    </div>



                    <!-- AI review -->
                    <div class="overview-stat">

                        <span class="stat-icon">
                            ✓
                        </span>

                        <div>

                            <strong id="reviewScore">
                                —
                            </strong>

                            <span>
                                AI review
                            </span>

                        </div>

                    </div>



                    <!-- Source reliability -->
                    <div class="overview-stat">

                        <span class="stat-icon">
                            ◉
                        </span>

                        <div>

                            <strong id="sourceReliability">
                                —
                            </strong>

                            <span>
                                Source reliability
                            </span>

                        </div>

                    </div>

                </section>



                <!-- ==================================
                     TOP SOURCES
                =================================== -->

                <section class="top-sources-card">

                    <header class="sidebar-card-header">

                        <h2>
                            Top Sources
                        </h2>

                        <button
                            type="button"
                            class="view-all-button"
                            id="viewAllSources"
                        >
                            View all →
                        </button>

                    </header>


                    <ol
                        class="top-sources-list"
                        id="topSourcesList"
                    >

                        <li>
                            Loading sources...
                        </li>

                    </ol>

                </section>

            </aside>

        </div>

    </main>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <!-- Global JavaScript -->
    <script src="../js/app.js"></script>

    <!-- Report page JavaScript -->
    <script src="../js/report.js"></script>


</body>

</html>
